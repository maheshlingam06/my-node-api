<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <!-- 1. Load the html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #f9f9f9;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1rem;
        }
    </style>
</head>
<body>

    <h2>Scan a QR Code</h2>
    <!-- 2. Create a container for the scanner -->
    <div id="reader"></div>
    <div id="scan-result"></div>

    <script>
        // 3. Define what happens when a QR code is successfully read
        function onScanSuccess(decodedText, decodedResult) {
            // Log the result to the console
            console.log("QR Code Data:", decodedText);
            // Check if the scanned text matches your expected Reunion format
            if (decodedText.startsWith("Reunion-2026-")) {
                
                // Extract the mobile number by replacing the prefix with an empty string
                const mobileNumber = decodedText.replace("Reunion-2026-", "");
                
                console.log("Extracted Mobile:", mobileNumber);

                processScannedQR(mobileNumber);
                
                // Optional: Stop scanning after a successful read
                // html5QrcodeScanner.clear();
                
            } else {
                console.warn("Unrecognized QR Code format:", decodedText);
            }
            
            // Optional: Stop the scanner after a successful scan
            // html5QrcodeScanner.clear();
        }

        // 4. Define what happens on a scan error
        function onScanFailure(error) {
            // The scanner constantly fires this error while looking for a QR code.
            // It's best to leave this empty or commented out so it doesn't spam your console.
            // console.warn(`Code scan error = ${error}`);
        }

        // 4. The async function matching your provided pattern
        async function processScannedQR(mobileNumber) {
            const token = localStorage.getItem('supabaseToken');
            
            // Assuming you have a div to display the results: <div id="scan-result"></div>
            const resultContainer = document.getElementById('scan-result');
            if (resultContainer) {
                resultContainer.innerHTML = '<p style="text-align:center; padding: 30px;">Fetching registration data...</p>';
            }

            try {
                const response = await fetch('/api/admin/get-submission', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mobile: mobileNumber })
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        alert("Session expired or access denied.");
                        window.location.replace('login');
                        return;
                    }
                    if (response.status === 404) {
                        throw new Error(`No registration found for mobile: ${mobileNumber}`);
                    }
                    throw new Error("Failed to fetch submission data");
                }

                const jsonResponse = await response.json();
                const data = jsonResponse.data; // The actual submission record

                // Update UI with success data
                if (resultContainer) {
                    resultContainer.innerHTML = `
                        <div style="background-color: #d4edda; padding: 20px; border-radius: 5px; color: #155724;">
                            <h3 style="margin-top: 0;">✅ Valid Registration Found</h3>
                            <p><strong>Name:</strong> ${data.participant_name || 'N/A'}</p>
                            <p><strong>Mobile:</strong> ${data.mobile}</p>
                            <p><strong>Email:</strong> ${data.email || 'N/A'}</p>
                            <button onclick="html5QrcodeScanner.resume()" style="margin-top: 10px;">Scan Next</button>
                        </div>
                    `;
                }
                
                // Note: If you want to automatically MARK ATTENDANCE right after finding the record, 
                // you could chain another fetch call to your '/api/admin/mark-attendance' endpoint here.

            } catch (err) {
                console.error("Scan Error:", err);
                if (resultContainer) {
                    resultContainer.innerHTML = `
                        <div style="background-color: #f8d7da; padding: 20px; border-radius: 5px; color: #721c24;">
                            <p>❌ <strong>Error:</strong> ${err.message}</p>
                            <button onclick="html5QrcodeScanner.resume()" style="margin-top: 10px;">Try Again</button>
                        </div>
                    `;
                }
            }
        }

        // 5. Initialize the scanner
        // fps: Frames per second to scan
        // qrbox: Defines the scanning area box size
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
        );
        
        // 6. Start the scanner
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
