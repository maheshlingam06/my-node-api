<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <!-- 1. Load the html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #f9f9f9;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1rem;
        }
    </style>
</head>
<body>

    <h2>Scan a QR Code</h2>
    <!-- 2. Create a container for the scanner -->
    <div id="reader"></div>
    <div id="scan-result"></div>

    <script>
        // Save token
        (function initializePersistentSession() {
            const primaryToken = localStorage.getItem('supabaseToken');
            
            if (primaryToken) {
                // Back it up to a new variable
                localStorage.setItem('persistentAdminToken', primaryToken);
            } else {
                // Primary was cleared. Check if we have our backup.
                const backupToken = localStorage.getItem('persistentAdminToken');
                if (!backupToken) {
                    // No backup exists either, force login
                    window.location.replace('login');
                }
            }
        })();

        // 3. Define what happens when a QR code is successfully read
        function onScanSuccess(decodedText, decodedResult) {
            // Log the result to the console
            console.log("QR Code Data:", decodedText);
            // Check if the scanned text matches your expected Reunion format
            if (decodedText.startsWith("Reunion-2026-")) {
                
                // Extract the mobile number by replacing the prefix with an empty string
                const mobileNumber = decodedText.replace("Reunion-2026-", "");
                
                console.log("Extracted Mobile:", mobileNumber);

                processScannedQR(mobileNumber);
                
                // Optional: Stop scanning after a successful read
                // html5QrcodeScanner.clear();
                
            } else {
                console.warn("Unrecognized QR Code format:", decodedText);
            }
            
            // Optional: Stop the scanner after a successful scan
            // html5QrcodeScanner.clear();
        }

        // 4. Define what happens on a scan error
        function onScanFailure(error) {
            // The scanner constantly fires this error while looking for a QR code.
            // It's best to leave this empty or commented out so it doesn't spam your console.
            // console.warn(`Code scan error = ${error}`);
        }

        function logout() {
            // Clear both the primary and the persistent backup
            localStorage.removeItem('supabaseToken');
            localStorage.removeItem('persistentAdminToken');
            
            // Redirect to login
            window.location.replace('login');
        }

        // Helper function to handle dropdown changes
        window.handleDateChange = function() {
            const rawDateSelected = document.getElementById('att_date').value;
            const dateMapping = {
                "Thu, 23rd Jul": "2026-07-23",
                "Fri, 24th Jul": "2026-07-24",
                "Sat, 25th Jul": "2026-07-25"
            };
            const dbDate = dateMapping[rawDateSelected];
            
            // Check if we have an existing database record for this date
            const existingRecord = window.currentScanData.attendanceByDate[dbDate];
            const defaults = window.currentScanData.defaults;
            const statusMsg = document.getElementById('att_status_msg');

            if (existingRecord) {
                // Preload with existing DB record
                document.getElementById('att_alumni').checked = existingRecord.alumni;
                document.getElementById('att_spouse').checked = existingRecord.spouse;
                document.getElementById('att_kids_gt_10').value = existingRecord.kids_gt_10;
                document.getElementById('att_kids_6_10').value = existingRecord.kids_6_10;
                document.getElementById('att_kids_lt_6').value = existingRecord.kids_lt_6;
                statusMsg.innerHTML = '<span style="color: #0056b3; font-size: 14px;">(Updating Existing Record)</span>';
            } else {
                // Preload with default registration data
                document.getElementById('att_alumni').checked = defaults.alumni;
                document.getElementById('att_spouse').checked = defaults.spouse;
                document.getElementById('att_kids_gt_10').value = defaults.kids_gt_10;
                document.getElementById('att_kids_6_10').value = defaults.kids_6_10;
                document.getElementById('att_kids_lt_6').value = defaults.kids_lt_6;
                statusMsg.innerHTML = '<span style="color: #28a745; font-size: 14px;">(New Check-in)</span>';
            }
        };

        async function processScannedQR(mobileNumber) {
            //const token = localStorage.getItem('persistentAdminToken') || localStorage.getItem('supabaseToken');const token = localStorage.getItem('supabaseToken');
            const token = localStorage.getItem('persistentAdminToken') || localStorage.getItem('supabaseToken');
            const resultContainer = document.getElementById('scan-result');
            
            if (resultContainer) {
                resultContainer.innerHTML = '<p style="text-align:center; padding: 30px;">Fetching registration data...</p>';
            }

            try {
                const response = await fetch('/api/admin/get-submission', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mobile: mobileNumber })
                });

                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        alert("Session expired or access denied.");
                        window.location.replace('login');
                        return;
                    }
                    throw new Error(response.status === 404 ? `No registration found for mobile: ${mobileNumber}` : "Failed to fetch submission data");
                }

                const jsonResponse = await response.json();
                const data = jsonResponse.data;           // The submission record
                const attendance = jsonResponse.attendance; // Array of existing attendance records

                // --- STORE STATE FOR DYNAMIC FORM CHANGES ---
                window.currentScanData = {
                    defaults: {
                        alumni: true,
                        spouse: data.spouse_attending === 'Yes',
                        kids_gt_10: data.adults_and_above_10 || 0,
                        kids_6_10: data.kids_6_10 || 0,
                        kids_lt_6: data.kids_under_6 || 0
                    },
                    attendanceByDate: {}
                };

                // Map existing attendance by date for easy lookup
                attendance.forEach(record => {
                    if (record.day_of_event) {
                        window.currentScanData.attendanceByDate[record.day_of_event] = record;
                    }
                });

                // --- BUILD COLUMN 1: Specific Ordered Data ---
                const displayFields = [
                    "id", "participant_name", "email", "mobile", "department", 
                    "class_reg_no", "spouse_attending", "adults_and_above_10", 
                    "kids_6_10", "kids_under_6", "thu_stay_type", "fri_family_join", 
                    "fri_stay_type", "sat_attend_type", "sat_stay_type", 
                    "payment_status", "amount_received", "donation_amount", 
                    "remarks", "t_shirt_size", "performing_culturals", 
                    "volunteering", "last_modified_at", "user_id"
                ];

                let col1Html = '<table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">';
                displayFields.forEach(key => {
                    const rawValue = data[key];
                    let displayValue = (rawValue === null || rawValue === '' || rawValue === undefined) ? '-' : rawValue;
                    const displayKey = key.replace(/_/g, ' ').toUpperCase();

                    if (key === 'last_modified_at' && displayValue !== '-') {
                        displayValue = new Date(displayValue).toLocaleString();
                    }

                    col1Html += `
                        <tr>
                            <td style="padding: 8px 4px; border-bottom: 1px solid #eee; font-weight: bold; color: #555; width: 45%;">${displayKey}</td>
                            <td style="padding: 8px 4px; border-bottom: 1px solid #eee; word-break: break-word;">${displayValue}</td>
                        </tr>
                    `;
                });
                col1Html += '</table>';

                // --- BUILD COLUMN 2: Attendance Form ---
                // Note the `onchange="handleDateChange()"` added to the select dropdown
                const col2Html = `
                    <div style="display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid #007bff; padding-bottom: 5px;">
                        <h3 style="margin: 0; color: #333;">Log Attendance</h3>
                        <span id="att_status_msg"></span>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; gap: 15px; font-size: 15px; margin-top: 15px;">
                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Date of Event</label>
                            <select id="att_date" onchange="handleDateChange()" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background: white;">
                                <option value="Thu, 23rd Jul">Thu, 23rd Jul</option>
                                <option value="Fri, 24th Jul">Fri, 24th Jul</option>
                                <option value="Sat, 25th Jul">Sat, 25th Jul</option>
                            </select>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                            <input type="checkbox" id="att_alumni" style="width: 20px; height: 20px;">
                            <label for="att_alumni" style="font-weight: bold; cursor: pointer;">Alumni Present</label>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 4px;">
                            <input type="checkbox" id="att_spouse" style="width: 20px; height: 20px;">
                            <label for="att_spouse" style="font-weight: bold; cursor: pointer;">Spouse Present</label>
                        </div>

                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Kids > 10 (Count)</label>
                            <input type="number" id="att_kids_gt_10" min="0" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        </div>

                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Kids 6-10 (Count)</label>
                            <input type="number" id="att_kids_6_10" min="0" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        </div>

                        <div>
                            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Kids < 6 (Count)</label>
                            <input type="number" id="att_kids_lt_6" min="0" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button onclick="submitAttendance('${data.user_id}', '${data.participant_name || ''}')" style="background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold;">Save Attendance</button>
                            <button onclick="resetScanner()" style="background-color: #6c757d; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; flex: 1; font-weight: bold;">Reset / Cancel</button>
                        </div>
                    </div>
                `;

                if (resultContainer) {
                    resultContainer.innerHTML = `
                        <div style="display: flex; flex-wrap: wrap; gap: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1000px; margin: 20px auto;">
                            <div style="flex: 1 1 350px; max-height: 600px; overflow-y: auto; padding-right: 15px; border-right: 2px solid #f0f0f0;">
                                <h3 style="margin-top: 0; color: #333; position: sticky; top: 0; background: white; padding-bottom: 10px; border-bottom: 2px solid #007bff;">Registration Details</h3>
                                ${col1Html}
                            </div>
                            <div style="flex: 1 1 300px;">
                                ${col2Html}
                            </div>
                        </div>
                    `;
                    
                    // Trigger the date change handler immediately to load the initial data for the first dropdown option
                    window.handleDateChange();
                }

            } catch (err) {
                console.error("Scan Error:", err);
                if (resultContainer) {
                    resultContainer.innerHTML = `
                        <div style="background-color: #f8d7da; padding: 20px; border-radius: 5px; color: #721c24; text-align: center; max-width: 500px; margin: 20px auto;">
                            <p>❌ <strong>Error:</strong> ${err.message}</p>
                            <button onclick="resetScanner()" style="margin-top: 15px; padding: 10px 20px; cursor: pointer;">Try Again</button>
                        </div>
                    `;
                }
            }
        }
        
        async function submitAttendance(userId, participantName) {
            //const token = localStorage.getItem('supabaseToken');
            const token = localStorage.getItem('persistentAdminToken') || localStorage.getItem('supabaseToken');
            
            // 1. Get the raw dropdown value
            const rawDateSelected = document.getElementById('att_date').value;

            // 2. Map the display text to the actual DB Date value format (YYYY-MM-DD)
            const dateMapping = {
                "Thu, 23rd Jul": "2026-07-23",
                "Fri, 24th Jul": "2026-07-24",
                "Sat, 25th Jul": "2026-07-25"
            };
            const mappedDbDate = dateMapping[rawDateSelected];

            // 3. Gather all data from the UI Form
            const payload = {
                user_id: userId,
                alumni_name: participantName,
                day_of_event: mappedDbDate, // Using the mapped date here
                alumni: document.getElementById('att_alumni').checked,
                spouse: document.getElementById('att_spouse').checked,
                kids_gt_10: parseInt(document.getElementById('att_kids_gt_10').value, 10) || 0,
                kids_6_10: parseInt(document.getElementById('att_kids_6_10').value, 10) || 0,
                kids_lt_6: parseInt(document.getElementById('att_kids_lt_6').value, 10) || 0,
            };

            try {
                const response = await fetch('/api/admin/mark-attendance', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "Failed to save attendance");
                }

                alert(`✅ Attendance for ${rawDateSelected} successfully recorded!`);
                //resetScanner();
                
            } catch (err) {
                console.error("Submission Error:", err);
                alert("Error: " + err.message);
            }
        }

        // Clears the UI and turns the camera back on
        function resetScanner() {
            const resultContainer = document.getElementById('scan-result');
            if (resultContainer) {
                resultContainer.innerHTML = ''; 
            }
            html5QrcodeScanner.resume(); // Unpause the camera
        }

        // 5. Initialize the scanner
        // fps: Frames per second to scan
        // qrbox: Defines the scanning area box size
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
        );
        
        // 6. Start the scanner
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
