<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donations Admin | Class of 2001 Reunion</title><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);:root{--color-text-main:#000000;--color-action-warm:#d9430f;--color-trust-blue:#0b5fb5;--bg-page:#f8fafc;--white:#ffffff;--border:#cbd5e1;--text-muted:#475569}body,html{margin:0;padding:0;height:100%;font-family:Inter,sans-serif;background-color:var(--bg-page);color:var(--color-text-main);overflow-x:hidden}#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;z-index:9999;display:flex;justify-content:center;align-items:center;color:#fff;font-size:1.5rem;font-weight:700;flex-direction:column;gap:15px}.spinner{border:4px solid rgba(255,255,255,.3);border-top:4px solid var(--color-trust-blue);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;background:#0f172a;color:var(--white)}.logo{color:var(--white);font-size:20px;font-weight:700;text-decoration:none}.nav-links{display:flex;gap:20px;align-items:center}.nav-links a{color:var(--white);text-decoration:none;font-size:14px;font-weight:500;opacity:.9}.nav-links a:hover{opacity:1;text-decoration:underline}.dashboard-container{padding:40px 60px;max-width:1400px;margin:0 auto;box-sizing:border-box;width:100%}.header-section{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{margin:0;color:#0f172a;font-weight:800}.summary-cards{display:flex;gap:20px;margin-bottom:30px}.summary-card{background:var(--white);padding:20px;border-radius:8px;border:1px solid var(--border);flex:1;box-shadow:0 4px 6px -1px rgba(0,0,0,.05)}.summary-title{font-size:.9rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-bottom:8px}.summary-value{font-size:2rem;font-weight:800;color:var(--color-trust-blue)}.summary-value.total{color:var(--color-action-warm)}.table-wrapper{width:100%;max-width:100vw;background:var(--white);border-radius:8px;border:1px solid var(--border);box-shadow:0 4px 6px -1px rgba(0,0,0,.05);overflow:hidden}.table-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:.95rem;min-width:1000px}td,th{padding:15px;border-bottom:1px solid var(--border);text-align:left}th{background:#f1f5f9;color:#0f172a;font-weight:700;white-space:nowrap;position:sticky;top:0}tr:hover{background:#f8fafc}.amt-col{text-align:right;font-family:monospace;font-size:14px}.badge{padding:4px 8px;border-radius:4px;font-size:.75rem;font-weight:700;text-transform:uppercase}.badge.pledged{background:#fef3c7;color:#b45309;border:1px solid #fde68a}.badge.completed{background:#dcfce7;color:#047857;border:1px solid #a7f3d0}@media (max-width:900px){.navbar{flex-direction:column;padding:20px 10px;gap:15px}.dashboard-container{padding:20px 10px}.header-section{flex-direction:column;align-items:stretch;gap:15px;text-align:center}.header-section h1{font-size:1.8rem}.header-section button{width:100%;padding:12px;font-size:1.1rem}.summary-cards{flex-direction:column;gap:15px}.table-wrapper{border-radius:0;border-left:none;border-right:none}}</style></head><body><div id="loading-overlay"><div class="spinner"></div><div>Authenticating Admin...</div></div><nav class="navbar"><a href="dashboard.html" class="logo">Reunion Admin Portal</a><div class="nav-links"><a href="admin.html">Event Registrations</a> <a href="#" style="font-weight:700;border-bottom:2px solid #fff">Endowment Pledges</a> <a href="#" id="btn-logout">Sign Out</a></div></nav><div class="dashboard-container"><div class="header-section"><h1>Endowment Fund Tracking</h1><button onclick="fetchDonations()" style="padding:10px 20px;background:var(--color-trust-blue);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:700">Refresh Data</button></div><div class="summary-cards"><div class="summary-card"><div class="summary-title">Total Pledged (All Funds)</div><div class="summary-value total" id="stat-total-pledged">₹0</div></div><div class="summary-card"><div class="summary-title">Total Donors</div><div class="summary-value" id="stat-donors">0</div></div><div class="summary-card"><div class="summary-title">Avg. Pledge / Donor</div><div class="summary-value" id="stat-avg" style="color:#0f172a">₹0</div></div></div><div class="table-wrapper"><div class="table-responsive"><table id="donations-table"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Mobile</th><th>Dept</th><th class="amt-col">Food Fund (Ann)</th><th class="amt-col">Scholarship (Ann)</th><th class="amt-col">Scholarship (One)</th><th class="amt-col">Idea Lab</th><th class="amt-col" style="background:#e2e8f0">Total Pledge</th><th>Status</th></tr></thead><tbody id="table-body"></tbody></table></div></div></div><script>function formatCurrency(t){return t?"₹"+t.toLocaleString("en-IN"):"-"}async function fetchDonations(){const t=localStorage.getItem("supabaseToken"),e=document.getElementById("table-body");e.innerHTML='<tr><td colspan="9" style="text-align:center; padding: 30px;">Loading data...</td></tr>';try{const n=await fetch("/api/admin/all-donations",{headers:{Authorization:`Bearer ${t}`}});if(!n.ok){if(401===n.status||403===n.status)return alert("Session expired or access denied."),void window.location.replace("login");throw new Error("Failed to fetch data")}const a=await n.json();if(0===a.length)return void(e.innerHTML='<tr><td colspan="9" style="text-align:center; padding: 30px;">No pledges found yet.</td></tr>');let o=0,r="";a.forEach(t=>{const e=new Date(t.created_at).toLocaleDateString("en-IN",{month:"short",day:"numeric",year:"numeric"}),n="completed"===t.payment_status?"completed":"pledged";o+=Number(t.total_amount),r+=`\n                        <tr>\n                            <td>${e}</td>\n                            <td style="font-weight: 600;">${t.participant_name}</td>\n                            <td style="color: var(--color-trust-blue);">${t.email}</td>\n                            <td>${t.mobile||"N/A"}</td>\n                            <td>${t.department||"N/A"}</td>\n                            <td class="amt-col">${formatCurrency(t.food_fund_annual)}</td>\n                            <td class="amt-col">${formatCurrency(t.schol_annual)}</td>\n                            <td class="amt-col">${formatCurrency(t.schol_onetime)}</td>\n                            <td class="amt-col">${formatCurrency(t.idealab)}</td>\n                            <td class="amt-col" style="font-weight: 800; background:#f8fafc;">${formatCurrency(t.total_amount)}</td>\n                            <td><span class="badge ${n}">${t.payment_status}</span></td>\n                        </tr>\n                    `}),e.innerHTML=r,document.getElementById("stat-total-pledged").innerText=formatCurrency(o),document.getElementById("stat-donors").innerText=a.length,document.getElementById("stat-avg").innerText=formatCurrency(Math.round(o/a.length))}catch(t){console.error("Error:",t),e.innerHTML='<tr><td colspan="9" style="text-align:center; padding: 30px; color: red;">Error loading data. Please check console.</td></tr>'}}window.onload=function(){const t=localStorage.getItem("supabaseToken"),e=localStorage.getItem("userType");if(!t||"x"!==e)return localStorage.removeItem("adminData"),alert("Access Denied: You are not an admin."),void window.location.replace("login");document.getElementById("loading-overlay").style.display="none",fetchDonations()},document.getElementById("btn-logout").addEventListener("click",t=>{t.preventDefault(),localStorage.removeItem("supabaseToken"),localStorage.removeItem("userType"),window.location.replace("login")})</script></body></html>
