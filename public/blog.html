<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Blog - TCE Reunion 2026</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --white: #ffffff;
            --overlay: rgba(15, 23, 42, 0.85);
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }

        .bg-image {
            background-image: url('https://your-supabase-url.com/storage/v1/object/public/assets/college_campus.jpg');
            height: 100%; background-position: center; background-repeat: no-repeat;
            background-size: contain; position: relative; background-color: black;
        }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            /*background-color: var(--overlay); display: flex; flex-direction: column; overflow-y: auto;*/
            display: flex; flex-direction: column; overflow-y: auto;
        }

        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; z-index: 10; }
        .logo { color: var(--white); font-size: 24px; font-weight: 700; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 15px; font-weight: 500; opacity: 0.9; transition: all 0.2s; }
        .nav-links a:hover { opacity: 1; color: #bfdbfe; }

        /* Main Container */
        .page-container {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px; width: 100%; box-sizing: border-box; z-index: 5;
        }

        .page-header { text-align: center; color: white; margin-bottom: 30px; }
        .page-header h1 { font-size: 3rem; margin: 0 0 10px 0; font-weight: 800; letter-spacing: -1px; }

        /* Cards & Forms */
        .glass-card {
            background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 12px;
            color: white; width: 100%; max-width: 700px; margin-bottom: 25px; text-align: left;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; }
        .form-control {
            width: 100%; padding: 12px; border-radius: 6px; box-sizing: border-box;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: white; font-family: 'Inter', sans-serif; font-size: 15px;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }
        
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }

        /* Quill Editor Dark Theme Overrides */
        .ql-toolbar.ql-snow {
            background: rgba(241, 245, 249, 0.95); /* Light grey for the toolbar buttons so they remain visible */
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px 6px 0 0;
        }
        .ql-container.ql-snow {
            border: 1px solid rgba(255,255,255,0.2);
            border-top: none;
            border-radius: 0 0 6px 6px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
        }
        .ql-editor.ql-blank::before {
            color: rgba(255,255,255,0.4); /* Make the placeholder text visible on dark background */
        }

        /* Keep blog photos contained within the cards */
        .post-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Blog Post Display */
        .post-title { margin: 0 0 10px 0; font-size: 1.5rem; color: #f8fafc; }
        .post-meta { font-size: 13px; color: #94a3b8; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .post-content { font-size: 15px; line-height: 1.7; color: #e2e8f0; white-space: pre-wrap; }

        @media (max-width: 900px) {
            .navbar { flex-direction: column; padding: 20px; gap: 15px; }
            .nav-links { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .page-header h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="bg-image">
        <div class="overlay">
            
            <nav class="navbar">
                <a href="/" class="logo">TCE Reunion 2026</a>
                <div class="nav-links">
                    <a href="registration.html">My Registration</a>
                    <a href="schedule.html">Program</a>
                    <a href="blog.html" style="color: #bfdbfe;">Blog</a>
                </div>
            </nav>

            <div class="page-container">
                <div class="page-header">
                    <h1>Memory Lane</h1>
                    <p style="color: #cbd5e1; margin-bottom: 20px;">Share your favorite stories, photos, and updates.</p>
                    <button class="btn" id="togglePostBtn" onclick="togglePostForm()">+ Share a Memory</button>
                </div>

                <div class="glass-card" id="composeCard" style="display: none;">
                    <h3 style="margin-top:0;">Write a Post</h3>
                    <form id="blogForm" onsubmit="submitPost(event)">
                        <div class="form-group">
                            <label>Your Name</label>
                            <input type="text" id="authorName" class="form-control" required placeholder="John Doe (CS Dept)">
                        </div>
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="postTitle" class="form-control" required placeholder="Remember the 1999 Cultural Fest?">
                        </div>
                        <div class="form-group">
                            <label>Story</label>
                            <!-- <textarea id="postContent" class="form-control" rows="5" required placeholder="Write your story here..."></textarea> -->
                             <div class="form-group">
                                <label>Story</label>
                                <div id="editor-container" style="height: 200px;"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn" id="submitBtn">Publish Post</button>
                        <button type="button" class="btn" style="background: transparent; border: 1px solid #64748b; margin-left: 10px;" onclick="togglePostForm()">Cancel</button>
                    </form>
                </div>

                <div id="blogFeed" style="width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center;">
                    <p style="color: white;">Loading memories...</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- INACTIVITY AUTO-LOGOUT ---
        let idleTime = 0;
        const timeoutLimit = 10; // Set timeout limit in minutes

        // Increment the idle time counter every minute
        const idleInterval = setInterval(timerIncrement, 60000); // 1 minute = 60000 ms

        function togglePostForm() {
            const form = document.getElementById('composeCard');
            const btn = document.getElementById('togglePostBtn');
            const token = localStorage.getItem('supabaseToken');

            if (!token) {
                alert("You must be signed in to post to the blog!");
                window.location.href = 'login';
                return;
            }

            if (form.style.display === 'none') {
                form.style.display = 'block';
                btn.style.display = 'none';
                
                // CALL THE NEW FUNCTION HERE
                prefillAuthorName(); 
                
            } else {
                form.style.display = 'none';
                btn.style.display = 'inline-block';
            }
        }

        async function submitPost(e) {
            e.preventDefault();
            const token = localStorage.getItem('supabaseToken');
            const btn = document.getElementById('submitBtn');
            
            const author_name = document.getElementById('authorName').value;
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;

            btn.disabled = true;
            btn.innerText = 'Publishing...';

            try {
                const response = await fetch('/api/blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ author_name, title, content })
                });

                if (response.ok) {
                    document.getElementById('blogForm').reset();
                    togglePostForm();
                    loadPosts(); // Refresh the feed!
                } else {
                    alert("Failed to publish post.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Network error occurred.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Publish Post';
            }
        }

        async function loadPosts() {
            const feed = document.getElementById('blogFeed');
            const token = localStorage.getItem('supabaseToken');
            // 1. Check if they are logged in before trying to fetch
            if (!token) {
                feed.innerHTML = '<p style="color: #94a3b8;">Please sign in to view memories.</p>';
                return;
            }
            const currentUserId = getCurrentUserId(); // Grab the logged-in user's ID
            try {
                const response = await fetch('/api/blog', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Backend Error Details:", response.status, errorText);
                    throw new Error(`Server returned status ${response.status}`);
                }
                const posts = await response.json();

                feed.innerHTML = ''; // Clear loading text

                if (posts.length === 0) {
                    feed.innerHTML = '<p style="color: #94a3b8;">No memories shared yet. Be the first!</p>';
                    return;
                }

                posts.forEach(post => {
                    const date = new Date(post.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    // NEW: Conditionally build the delete button
                    let deleteBtnHTML = '';
                    if (post.user_id === currentUserId) {
                        deleteBtnHTML = `
                            <div style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; text-align: right;">
                                <button onclick="deletePost('${post.id}')" style="background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s;">
                                    Delete Post
                                </button>
                            </div>
                        `;
                    }
                    
                    const card = document.createElement('div');
                    card.className = 'glass-card';
                    card.innerHTML = `
                        <h2 class="post-title">${post.title}</h2>
                        <div class="post-meta">By <strong>${post.author_name}</strong> • ${date}</div>
                        <div class="post-content">${post.content}</div>
                        ${deleteBtnHTML} `;
                    feed.appendChild(card);
                });
            } catch (err) {
                feed.innerHTML = '<p style="color: #ef4444;">Failed to load blog feed.</p>';
            }
        }

        // --- NEW: Fetch and Auto-fill User Name ---
        async function prefillAuthorName() {
            const token = localStorage.getItem('supabaseToken');
            if (!token) return; // If not logged in, do nothing

            try {
                const response = await fetch('/get-registration', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data && data.participant_name) {
                        const nameInput = document.getElementById('authorName');
                        
                        // Combine name and department if available
                        let displayName = data.participant_name;
                        if (data.department) {
                            displayName += ` (${data.department})`;
                        }
                        
                        nameInput.value = displayName;
                        
                        // Optional: Make it read-only so they can't change their identity
                        nameInput.readOnly = true;
                        nameInput.style.opacity = '0.7'; 
                        nameInput.style.cursor = 'not-allowed';
                    }
                }
            } catch (err) {
                console.error("Could not fetch user profile for auto-fill:", err);
            }
        }

        // Load posts as soon as page opens
        document.addEventListener('DOMContentLoaded', loadPosts);

        // --- DELETE POST LOGIC ---
        async function deletePost(postId) {
            // Add a confirmation so they don't accidentally delete a massive story
            if (!confirm("Are you sure you want to delete this memory? This cannot be undone.")) {
                return;
            }

            const token = localStorage.getItem('supabaseToken');
            
            try {
                const response = await fetch(`/api/blog/${postId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    // It worked! Reload the feed to make the card disappear
                    loadPosts(); 
                } else {
                    const data = await response.json();
                    alert("Failed to delete post: " + (data.error || "Unknown error"));
                }
            } catch (err) {
                console.error("Error deleting post:", err);
                alert("A network error occurred while trying to delete.");
            }
        }

        function handleLogout(){
           /* window.location.href = "login"; */
            localStorage.removeItem('supabaseToken');
            //localStorage.removeItem('adminData'); // Clear admin cache too if it exists

            // 2. Replace the current history entry
            // This removes the current page from the "Back" stack
            window.location.replace('login');
        }

        function timerIncrement() {
            idleTime++;
            if (idleTime >= timeoutLimit) {
                // User has been idle for 15 minutes
                clearInterval(idleInterval);
                alert("Your session has expired due to inactivity. Please log in again.");
                handleLogout(); // Calls your existing logout function
            }
        }
    </script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script>
        // --- 1. INITIALIZE QUILL WITH CUSTOM TOOLBAR ---
        let quill;
        const userType = localStorage.getItem('userType');
        if (userType == 'x'){
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your story and share memories...',
                modules: {
                    toolbar: {
                        container: [
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['image', 'link'], // Added the image and link buttons!
                            ['clean']
                        ],
                        handlers: {
                            // Intercept the default image button click
                            image: selectLocalImage 
                        }
                    }
                }
            });
        }
        else{
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Write your story and share memories...',
                modules: {
                    toolbar: {
                        container: [
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['clean']
                        ]
                    }
                }
            });
        }

        // --- 2. CUSTOM IMAGE UPLOAD LOGIC ---
        function selectLocalImage() {
            // Create a hidden file input on the fly
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            // Listen for when the user selects a file
            input.onchange = async () => {
                const file = input.files[0];
                if (file) {
                    await uploadImageToServer(file);
                }
            };
        }

       async function uploadImageToServer(file) {
            // Save the user's current cursor position in the editor
            const range = quill.getSelection();

            try {
                // --- 1. COMPRESS THE IMAGE ---
                quill.insertText(range.index, 'Compressing image...', 'italic', true);

                const options = {
                    maxSizeMB: .05,           // Max file size (1MB is plenty for a blog)
                    maxWidthOrHeight: 1200, // Scale down massive 4K phone photos
                    useWebWorker: true      // Keeps the browser from freezing during compression
                };

                // Do the actual compression
                const compressedFile = await imageCompression(file, options);

                // Update the loading text
                quill.deleteText(range.index, 20); // Remove "Compressing image..."
                quill.insertText(range.index, 'Uploading to server...', 'italic', true);


                // --- 2. UPLOAD TO BACKEND ---
                const token = localStorage.getItem('supabaseToken');
                const formData = new FormData();
                
                // Append the newly compressed file instead of the original!
                formData.append('image', compressedFile, file.name);

                const response = await fetch('/api/upload-image', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const data = await response.json();

                // Remove the "Uploading..." text
                quill.deleteText(range.index, 22); 

                if (response.ok) {
                    // Insert the actual image URL into the editor
                    quill.insertEmbed(range.index, 'image', data.url);
                    quill.setSelection(range.index + 1);
                } else {
                    alert("Failed to upload image.");
                }
            } catch (error) {
                console.error("Compression/Upload error:", error);
                quill.deleteText(range.index, 22); // Clean up the loading text
                alert("An error occurred while processing the image.");
            }
        }

        // 2. Update your submitPost function
        async function submitPost(e) {
            e.preventDefault();
            const token = localStorage.getItem('supabaseToken');
            const btn = document.getElementById('submitBtn');
            
            const author_name = document.getElementById('authorName').value;
            const title = document.getElementById('postTitle').value;
            
            // NEW: Grab the raw HTML content directly from Quill
            const content = quill.root.innerHTML; 
            
            // Safety check: Prevent submitting if the editor is completely empty
            if (quill.getText().trim() === '') {
                alert("Please write a story before publishing!");
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Publishing...';

            try {
                const response = await fetch('/api/blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ author_name, title, content })
                });

                if (response.ok) {
                    document.getElementById('blogForm').reset();
                    quill.setContents([]); // NEW: Clear the Quill editor
                    togglePostForm();
                    loadPosts(); 
                } else {
                    alert("Failed to publish post.");
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Network error occurred.");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Publish Post';
            }
        }
        // --- DECODE JWT TO GET USER ID ---
        function getCurrentUserId() {
            const token = localStorage.getItem('supabaseToken');
            if (!token) return null;
            
            try {
                // A JWT is 3 parts separated by dots. The middle part is the payload data.
                const payloadBase64 = token.split('.')[1];
                // Decode the base64 string
                const decodedPayload = JSON.parse(atob(payloadBase64));
                
                // In Supabase, 'sub' (Subject) holds the unique User ID
                return decodedPayload.sub; 
            } catch (e) {
                console.error("Failed to decode token", e);
                return null;
            }
        }
    </script>
    
</body>
</html>
