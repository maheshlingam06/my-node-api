<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class of 2000 Reunion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --white: #ffffff;
            --overlay: rgba(15, 23, 42, 0.9); /* Darker blue-black overlay for better text pop */
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; }

        .bg-image {
            /* REPLACE WITH YOUR SUPABASE URL */
            background-image: url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/MCA-Alumni.jpg');
            height: 100%;
            background-position: center;
            background-size: cover;
            position: relative;
        }

        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--overlay);
            display: flex; flex-direction: column;
            overflow-y: auto;
        }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 60px; z-index: 10;
        }
        .logo { color: var(--white); font-size: 24px; font-weight: 700; text-decoration: none; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 15px; font-weight: 500; opacity: 0.9; }
        .nav-links a:hover { opacity: 1; color: #bfdbfe; }

        /* --- NEW HERO LAYOUT (Split Screen) --- */
        .hero-container {
            flex-grow: 1;
            display: flex;
            align-items: center; /* Vertically center everything */
            justify-content: center;
            padding: 0 60px;
            width: 100%;
            box-sizing: border-box; /* Ensures padding doesn't widen the page */
            z-index: 999;
    }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr; /* Text takes slightly more space */
            gap: 80px;
            max-width: 1200px;
            width: 100%;
            align-items: center;
        }

        /* Left Side: Text & Buttons */
        .hero-text { text-align: left; color: var(--white); }
        h1 { font-size: 3.5rem; margin-bottom: 20px; font-weight: 800; line-height: 1.1; }
        p { font-size: 1.2rem; line-height: 1.6; color: #e2e8f0; margin-bottom: 30px; max-width: 500px; }

        /* New CTA Buttons Group */
        .cta-group { display: flex; gap: 15px; }
        
        .btn-hero {
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

        .btn-outline {
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
        }
        .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.1); }


        /* --- RIGHT SIDE: GLASS CAROUSEL --- */
        .program-card {
            background: rgba(255, 255, 255, 0.1); /* Glass effect */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 16px;
            color: white;
            min-height: 200px;
            position: relative;
        }

        .program-card h3 { margin-top: 0; color: #bfdbfe; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }

        .carousel-slide { display: none; animation: fade 1s; }
        .carousel-slide p { font-size: 0.95rem; margin-bottom: 8px; color: #f1f5f9; }
        
        .date-badge {
            background: rgba(37, 99, 235, 0.3);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
            border: 1px solid rgba(147, 197, 253, 0.3);
        }

        /* Dots */
        .carousel-dots { margin-top: 20px; text-align: center; }
        .dot {
            height: 8px; width: 8px; margin: 0 4px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 50%; display: inline-block; cursor: pointer;
        }
        .active-dot { background-color: var(--primary); transform: scale(1.2); }

        @keyframes fade { from {opacity: 0} to {opacity: 1} }

        /* Footer */
        .copyright-panel {
            text-align: center; padding: 15px; font-size: 12px;
            color: rgba(255,255,255,0.4); margin-top: auto;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .navbar { flex-direction: column; padding: 20px; }
            .hero-grid { grid-template-columns: 1fr; gap: 40px; text-align: center; }
            .hero-text { align-items: center; display: flex; flex-direction: column; }
            .cta-group { justify-content: center; }
            .program-card { margin: 0 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-image">
        <div class="overlay">
            
            <nav class="navbar">
                <a href="#" class="logo">Reunion 2026</a>
                <div class="nav-links">
                    <a href="login.html">Sign-in</a>
                    <a href="#">Program</a>
                    <a href="#">Blog</a>
                    <a href="#">Endowment Fund</a>
                    <a href="#">Contact Us</a>
                    
                    <a href="signup.html" class="btn-register">Register Now</a>
                    
                    <a href="dashboard.html" class="admin-link">Admin</a>
                </div>
            </nav>

            <div class="hero-content">
                <h1>Welcome Back, Class of 1997</h1>
                <p>Join us for a weekend of memories, celebration, and connection at the Heritage Resort.</p>
            </div>
            <footer class="copyright-panel">
                &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
            </footer>
        </div>
    </div>

</body>
</html>
