<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class of 2000 Reunion</title>
    <style>
    /* Import a nice font to ensure consistency */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --white: #ffffff;
        --overlay: rgba(15, 23, 42, 0.9); /* Darker blue-black overlay for better text pop */
    }

    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Inter', sans-serif; /* Force consistent font everywhere */
    }

    .bg-image {
        /* REPLACE WITH YOUR SUPABASE URL */
        background-image: url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/MCA-Alumni.jpg');
        height: 100%;
        background-position: center;
        background-size: cover;
        position: relative;
    }

    .overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: var(--overlay);
        display: flex;
        flex-direction: column;
        overflow-y: auto; /* Allow scrolling if screen is short */
    }

    /* --- NAVIGATION BAR FIXES --- */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center; /* Vertically centers Logo and Menu */
        padding: 20px 40px;
        width: 100%;
        box-sizing: border-box; /* Ensures padding doesn't widen the page */
        z-index: 999;
    }

    .logo {
        color: var(--white);
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
        letter-spacing: -0.5px;
    }

    .nav-links {
        display: flex;
        gap: 30px; /* Consistent spacing between all items */
        align-items: center; /* CRITICAL: Forces text and button to same center line */
    }

    /* Style ALL links consistently first */
    .nav-links a {
        color: var(--white);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        opacity: 0.9;
        transition: all 0.2s ease;
        white-space: nowrap; /* Prevents wrapping */
    }

    .nav-links a:hover {
        opacity: 1;
        color: #bfdbfe;
    }

    /* Special styling ONLY for the button */
    a.btn-register {
        background-color: var(--primary);
        padding: 10px 24px;
        border-radius: 50px; /* Pill shape looks more modern */
        color: white !important;
        font-weight: 600;
        opacity: 1;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        border: 1px solid transparent;
    }

    a.btn-register:hover {
        background-color: var(--primary-hover);
        transform: translateY(-1px); /* Subtle lift effect */
        box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.2);
    }

    /* Admin Link Styling */
    .admin-link {
        font-size: 13px !important;
        opacity: 0.6 !important;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 4px 10px;
        border-radius: 4px;
    }
    
    .admin-link:hover {
        opacity: 1 !important;
        border-color: rgba(255,255,255,0.8);
    }

    /* Hero Text */
    .hero-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: var(--white);
        padding: 20px;
        margin-top: -80px; /* Pulls text up slightly to balance visual center */
    }

    .copyright-panel {
        width: 100%;
        padding: 15px 0;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5); /* Subtle, semi-transparent white */
        margin-top: auto; /* Pushes the footer to the very bottom */
        font-weight: 400;
        letter-spacing: 0.5px;
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); /* Optional fade for readability */
    }

    h1 { font-size: 3.5rem; margin-bottom: 15px; font-weight: 800; letter-spacing: -1px; }
    p { font-size: 1.25rem; line-height: 1.6; max-width: 600px; color: #e2e8f0; }

    /* Mobile Responsive */
    @media (max-width: 900px) {
        .navbar { flex-direction: column; gap: 20px; padding: 20px; }
        .nav-links { flex-wrap: wrap; justify-content: center; gap: 15px; }
        h1 { font-size: 2.2rem; }
    }
    /* Mobile Responsive */
    @media (min-width: 900px) {
        .bg-image {
            /* REPLACE WITH YOUR SUPABASE URL */
            background-image: url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/MCA-Alumni.jpg');
            height: 100%;
            background-position: center;
            background-size: contain;
            position: relative;
        }
    }
</style>
</head>
<body>

    <div class="bg-image">
        <div class="overlay">
            
            <nav class="navbar">
                <a href="#" class="logo">Reunion 2026</a>
                <div class="nav-links">
                    <a href="login.html">Sign-in</a>
                    <a href="#">Program</a>
                    <a href="#">Blog</a>
                    <a href="#">Endowment Fund</a>
                    <a href="#">Contact Us</a>
                    
                    <a href="signup.html" class="btn-register">Register Now</a>
                    
                    <a href="dashboard.html" class="admin-link">Admin</a>
                </div>
            </nav>

            <div class="hero-content">
                <h1>Welcome Back, Class of 1997</h1>
                <p>Join us for a weekend of memories, celebration, and connection at the Heritage Resort.</p>
            </div>
            <footer class="copyright-panel">
                &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
            </footer>
        </div>
    </div>

</body>
</html>
