<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who's Coming - Reunion 2026</title><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);:root{--primary:#2563eb;--white:#ffffff;--overlay:rgba(0, 0, 0, 0.75)}body,html{margin:0;padding:0;min-height:100%;font-family:Inter,sans-serif}.bg-image{background-image:url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/JGems-TCE-Black.jpeg');min-height:100vh;background-position:center;background-attachment:fixed;background-repeat:no-repeat;background-size:contain;position:relative;background-color:#0f172a}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background-color:var(--overlay);display:flex;flex-direction:column;overflow-y:auto}.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;z-index:10}.logo{color:var(--white);font-size:24px;font-weight:700;text-decoration:none}.nav-links{display:flex;gap:30px;align-items:center}.nav-links a{color:var(--white);text-decoration:none;font-size:15px;font-weight:500;opacity:.9;transition:all .2s}.nav-links a:hover{opacity:1;color:#bfdbfe}.page-container{flex-grow:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px;width:100%;box-sizing:border-box;z-index:5}.page-header{text-align:center;color:#fff;margin-bottom:40px}.page-header h1{font-size:3rem;margin:0 0 10px 0;font-weight:800;letter-spacing:-1px}.page-header p{font-size:1.1rem;color:#cbd5e1;margin:0}.departments-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:25px;width:100%;max-width:1200px}.dept-card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:25px;color:#fff;transition:transform .2s ease}.dept-card:hover{transform:translateY(-5px);background:rgba(255,255,255,.08)}.dept-header{font-size:1.2rem;font-weight:700;color:#93c5fd;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:15px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}.attendee-count{background:rgba(37,99,235,.4);color:#bfdbfe;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}.attendee-list{list-style:none;padding:0;margin:0;max-height:300px;overflow-y:auto}.attendee-list::-webkit-scrollbar{width:6px}.attendee-list::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}.attendee-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:10px}.attendee-list li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:15px;color:#f8fafc;display:flex;align-items:center}.attendee-list li:last-child{border-bottom:none}.avatar-circle{width:30px;height:30px;border-radius:50%;background-color:rgba(37,99,235,.2);color:#93c5fd;display:flex;justify-content:center;align-items:center;font-weight:700;font-size:12px;margin-right:12px}.empty-state,.loading{text-align:center;color:#cbd5e1;padding:40px;width:100%;font-size:1.1rem}@media (max-width:900px){.navbar{flex-direction:column;padding:20px;gap:15px}.nav-links{flex-wrap:wrap;justify-content:center;gap:15px}.page-header h1{font-size:2.2rem}.departments-grid{grid-template-columns:1fr}}</style></head><body><div class="bg-image"><div class="overlay"><nav class="navbar"><a href="/" class="logo">TCE Reunion 2026</a><div class="nav-links"><a href="login">Sign-in</a> <a href="schedule.html">Program</a> <a href="attendees.html" style="color:#bfdbfe">Who's Coming</a> <a href="blog.html">Blog</a> <a href="admin.html">Admin</a></div></nav><div class="page-container"><div class="page-header"><h1>Who's Coming?</h1><p>Alumni registrations for the event!!</p></div><div id="loading" class="loading">Loading the guest list...</div><div id="departments-container" class="departments-grid" style="display:none"></div></div><footer style="text-align:center;padding:20px;font-size:12px;color:rgba(255,255,255,.4);margin-top:auto">&copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.</footer></div></div><script>document.addEventListener("DOMContentLoaded",async()=>{const e=document.getElementById("loading"),t=document.getElementById("departments-container");try{const n=await fetch("/api/attendees");if(!n.ok)throw new Error("Failed to fetch");const a=await n.json();if(e.style.display="none",!a||0===a.length)return t.style.display="block",void(t.innerHTML='<div class="empty-state">No one has registered yet. Be the first!</div>');const s=a.reduce((e,t)=>{const n=t.department||"Other";return e[n]||(e[n]=[]),e[n].push(t.participant_name),e},{}),r=Object.keys(s).sort();let o="";r.forEach(e=>{const t=s[e];t.sort((e,t)=>e.localeCompare(t));let n=t.map(e=>`\n                            <li>\n                                <div class="avatar-circle">${e?e.charAt(0).toUpperCase():"?"}</div>\n                                ${e}\n                            </li>\n                        `).join("");o+=`\n                        <div class="dept-card">\n                            <div class="dept-header">\n                                ${e}\n                                <span class="attendee-count">${t.length}</span>\n                            </div>\n                            <ul class="attendee-list">\n                                ${n}\n                            </ul>\n                        </div>\n                    `}),t.innerHTML=o,t.style.display="grid"}catch(t){console.error("Error loading attendees:",t),e.innerHTML="Sorry, we couldn't load the guest list right now. Please try again later."}})</script></body></html>
