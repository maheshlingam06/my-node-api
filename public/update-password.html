<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCE 2026 Reunion - Update Password</title><style>:root{--primary:#2563eb;--bg:#f8fafc;--text:#1e293b;--border:#e2e8f0;--white:#ffffff}body{font-family:Inter,sans-serif;background-color:var(--bg);display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex:1}.card{background:var(--white);padding:30px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid var(--border);width:100%;max-width:400px}h2{color:var(--primary);margin-bottom:20px;font-size:1.5rem;text-align:center}.input-group{margin-bottom:15px}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box}.btn-submit{width:100%;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}.btn-submit:hover{background:#1d4ed8}.loader{display:none;text-align:center;margin-top:10px;font-size:14px;color:var(--primary)}.copyright-panel{text-align:center;padding:20px;font-size:12px;color:rgba(0,0,0,.6);margin-top:auto;position:fixed;bottom:10px}.error-message{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;display:none}</style></head><body><div class="card"><h2>Create New Password</h2><p style="text-align:center;font-size:14px;color:#64748b;margin-bottom:20px">Please enter your new password below.</p><div class="input-group"><label>New Password</label> <input type="password" id="newPassword" placeholder="••••••••" required></div><div class="input-group"><label>Confirm New Password</label> <input type="password" id="confirmPassword" placeholder="••••••••" required></div><button id="submitBtn" onclick="handleUpdatePassword()" class="btn-submit">Save New Password</button><div id="loader" class="loader">Updating...</div><div id="errorMsg" class="error-message"></div></div><footer class="copyright-panel">&copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.</footer><script>let accessToken=null;async function handleUpdatePassword(){const e=document.getElementById("newPassword").value,t=document.getElementById("confirmPassword").value,s=document.getElementById("submitBtn"),n=document.getElementById("loader"),o=document.getElementById("errorMsg");if(o.style.display="none",!e||!t)return o.innerText="Please fill out both fields.",void(o.style.display="block");if(e!==t)return o.innerText="Passwords do not match.",void(o.style.display="block");if(e.length<6)return o.innerText="Password must be at least 6 characters.",void(o.style.display="block");s.style.display="none",n.style.display="block";try{const t=await fetch("../update-password",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${accessToken}`},body:JSON.stringify({password:e})}),l=await t.json();t.ok?(alert("Success! Your password has been updated. Please log in."),window.location.href="login.html"):(o.innerText=l.error||"Failed to update password.",o.style.display="block",s.style.display="block",n.style.display="none")}catch(e){o.innerText="Server error. Please try again later.",o.style.display="block",s.style.display="block",n.style.display="none"}}window.onload=function(){const e=window.location.hash.substring(1),t=new URLSearchParams(e);accessToken=t.get("access_token");const s=t.get("type");accessToken&&"recovery"===s||(document.getElementById("errorMsg").innerText="Invalid or expired recovery link. Please request a new one.",document.getElementById("errorMsg").style.display="block",document.getElementById("submitBtn").disabled=!0,document.getElementById("submitBtn").style.opacity="0.5")}</script></body></html>
