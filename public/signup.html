<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 1: Alumni Account Signup</title><style>:root{--primary:#2563eb;--bg:#f8fafc;--text:#1e293b;--border:#e2e8f0;--white:#ffffff}body{font-family:Inter,sans-serif;background-color:var(--bg);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.card{background:var(--white);padding:30px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid var(--border);width:100%;max-width:400px;max-height:fit-content}h2{color:var(--primary);margin-bottom:20px;font-size:1.5rem;text-align:center}.input-group{margin-bottom:15px}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box}.btn-submit{width:100%;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}.btn-submit:hover{background:#1d4ed8}.loader{display:none;text-align:center;margin-top:10px;font-size:14px;color:var(--primary)}.copyright-panel{text-align:center;padding:20px;font-size:12px;color:rgba(0,0,0,.6);margin-top:auto;position:fixed;bottom:10px}</style><script src="https://www.google.com/recaptcha/api.js?render=__SITE_KEY__"></script></head><body><div class="card"><h2>Join the Reunion</h2><p style="text-align:center;font-size:14px;color:#64748b;margin-bottom:20px">Step 1: Create your secure account</p><div class="input-group"><label>Email Address</label> <input type="email" id="email" placeholder="family@example.com" required></div><div class="input-group"><label>Create Password</label> <input type="password" id="password" placeholder="••••••••" required></div><button id="submitBtn" onclick="handleSignup()" class="btn-submit">Sign Up & Continue</button><div id="loader" class="loader">Verifying...</div></div><footer class="copyright-panel">&copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.</footer><script>async function handleSignup(){const e=document.getElementById("email").value,n=document.getElementById("password").value,t=document.getElementById("submitBtn"),o=document.getElementById("loader");if(!e||!n)return alert("Please fill in all fields.");t.style.display="none",o.style.display="block",grecaptcha.ready(function(){grecaptcha.execute("__SITE_KEY__",{action:"signup"}).then(async i=>{try{const l=await fetch("../signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:n,captchaToken:i})}),s=await l.json();if(l.ok)if(s.user&&!s.session){document.querySelector(".card").innerHTML=`\n                            <div style="text-align: center;">\n                                <h2 style="color: #10b981; margin-bottom: 10px;">Check Your Inbox</h2>\n                                <p style="color: #64748b; font-size: 15px; line-height: 1.5;">We just sent a verification link to<br><strong>${e}</strong></p>\n                                <p style="color: #64748b; font-size: 14px; margin-top: 15px;">Please click the link in the email to activate your account before logging in.</p>\n                                <button onclick="window.location.href='/login'" class="btn-submit" style="margin-top: 20px;">Proceed to Login</button>\n                            </div>\n                        `}else s.user&&s.session&&(localStorage.setItem("supabaseToken",s.session.access_token),window.location.href=`registration.html?email=${encodeURIComponent(e)}`);else alert("Signup failed: "+(s.error||"Unknown error")),t.style.display="block",o.style.display="none"}catch(e){alert("Server error. Please check your connection."),t.style.display="block",o.style.display="none"}})})}</script></body></html>
