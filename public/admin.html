<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Reunion 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 20px; }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; }
        
        input[type="text"] {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 300px;
        }

        .copyright-panel { text-align: center; padding: 20px; font-size: 12px; color: rgba(0,0,0,0.6); margin-top: auto; position: fixed; bottom: 10px;}

        
        button {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-refresh { background-color: #2563eb; color: white; }
        .btn-refresh:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #cbd5e1; color: #334155; }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; font-weight: 600; color: #475569; position: sticky; top: 0; }
        tr:hover { background-color: #f8fafc; }

        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-green { background-color: #dcfce7; color: #166534; }
        .badge-blue { background-color: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Registration Dashboard</h2>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search any field (Name, Email, City)...">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                <button onclick="exportTableToCSV('Reunion_Registrations_2026.csv')" style="background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: all 0.2s;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export to Excel (CSV)
                </button>
            </div>
            <button class="btn-refresh" onclick="fetchData(true)">🔄 Refresh Data</button>
            <button class="btn-clear" onclick="window.location.href='/'">Back to Home</button>
        </div>
    </div>

    <div class="table-container">
        <table id="regTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Adults (>10y)</th>
                    <th>Kids (6-10y)</th>
                    <th>Fri Night Stay</th>
                    <th>Fri Reunion</th>
                    <th>Sat Reunion</th>
                    <th>Total Cost</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
    <footer class="copyright-panel">
        &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
    </footer>

    <script>
        // 1. Calculate Cost Helper (Same logic as registration page)
        // 1. Updated Cost Calculation
        function calculateRowCost(row) {
            const adults = parseInt(row.teens_adults) || 0;
            // Fallback to row.kids just in case older test data hasn't been migrated
            const kids6to10 = parseInt(row.kids_6_10) || parseInt(row.kids) || 0; 

            const alumniCount = adults > 0 ? 1 : 0;
            const secondMemCount = adults > 1 ? 1 : 0;
            const thirdMemPlusCount = adults > 2 ? adults - 2 : 0;

            let total = 0;

            function addStayCost(selection) {
                if (selection === 'yes_single') {
                    total += (alumniCount * 5650);
                } else if (selection === 'yes_family') {
                    total += (alumniCount * 5650) + (secondMemCount * 5500) + (thirdMemPlusCount * 2500) + (kids6to10 * 2000);
                }
            }

            // Apply Resort Stay Costs
            addStayCost(row.thu_night);
            addStayCost(row.fri_night);
            addStayCost(row.sat_night);

            // Friday Event & Dinner
            if (row.fri_reunion === 'yes') {
                total += (alumniCount * 7000) + (secondMemCount * 1700) + (thirdMemPlusCount * 1700) + (kids6to10 * 850);
            }

            // Saturday Event & Lunch
            if (row.sat_reunion === 'yes_single') {
                total += (alumniCount * 1400);
            } else if (row.sat_reunion === 'yes_family') {
                total += (alumniCount * 1400) + (secondMemCount * 1100) + (thirdMemPlusCount * 1100) + (kids6to10 * 550);
            }

            return total;
        }

        // 2. Render Function
        // 2. Render Function
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Clear current rows

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">No records found.</td></tr>';
                return;
            }

            data.forEach(row => {
                const cost = calculateRowCost(row);
                const tr = document.createElement('tr');
                
                // Use kids_6_10, but fallback to kids for old data
                const displayKids = row.kids_6_10 !== undefined ? row.kids_6_10 : (row.kids || 0);
                
                // Show department, fallback to location if older data
                const displayDept = row.department || row.location || '-';

                tr.innerHTML = `
                    <td style="font-weight:500">${row.participant_name || '-'}</td>
                    <td>${row.mobile || '-'}</td>
                    <td>${row.email || '-'}</td>
                    <td>${displayDept}</td>
                    <td>${row.teens_adults || 0}</td>
                    <td>${displayKids}</td>
                    <td>${row.fri_night === 'yes_family' || row.fri_night === 'yes_single' ? '<span class="badge badge-green">Yes</span>' : '-'}</td>
                    <td>${row.fri_reunion === 'yes' ? '<span class="badge badge-blue">Yes</span>' : '-'}</td>
                    <td>${row.sat_reunion === 'yes_family' || row.sat_reunion === 'yes_single' ? '<span class="badge badge-blue">Yes</span>' : '-'}</td>
                    <td style="font-weight:bold">₹${cost.toLocaleString('en-IN')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Search Logic
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const storedData = localStorage.getItem('adminData');
            
            if (storedData) {
                const allData = JSON.parse(storedData);
                const filtered = allData.filter(row => {
                    // Combine all searchable fields into one string for easy checking
                    const searchableStr = `
                        ${row.participant_name} 
                        ${row.email} 
                        ${row.mobile} 
                        ${row.department} 
                        ${row.location}
                    `.toLowerCase();
                    return searchableStr.includes(term);
                });
                renderTable(filtered);
            }
        });


        // --- EXPORT TO EXCEL (CSV) LOGIC ---
        function exportTableToCSV(filename) {
            // Make sure 'registrationsTable' matches the ID of your <table> tag
            const table = document.getElementById("regTable"); 
            let csv = [];
            
            // Loop through all table rows (including headers)
            for (let i = 0; i < table.rows.length; i++) {
                let row = [];
                let cols = table.rows[i].querySelectorAll("td, th");
                
                for (let j = 0; j < cols.length; j++) {
                    // Get the text, remove newlines, and trim whitespace
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").trim();
                    
                    // Escape double quotes inside the data
                    data = data.replace(/"/g, '""');
                    
                    // Wrap in quotes to prevent commas in the data from breaking the columns
                    row.push('"' + data + '"');
                }
                csv.push(row.join(","));
            }
            
            // Trigger the download
            downloadCSV(csv.join("\n"), filename);
        }

        function downloadCSV(csv, filename) {
            let csvFile;
            let downloadLink;

            // Create a Blob with the CSV data
            csvFile = new Blob([csv], {type: "text/csv;charset=utf-8;"});

            // Create a hidden link, attach the Blob, and click it
            downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            
            downloadLink.click();
            
            // Clean up
            document.body.removeChild(downloadLink);
        }
        // 4. Fetch Logic (Cache First Strategy)
        async function fetchData(forceRefresh = false) {
            const token = localStorage.getItem('supabaseToken');
            if (!token) {
                alert("You must be logged in to view this page.");
                window.location.href = '/login.html';
                return;
            }

            // Check Cache first
            const cached = localStorage.getItem('adminData');
            if (cached && !forceRefresh) {
                console.log("Loading from LocalStorage...");
                renderTable(JSON.parse(cached));
                return;
            }

            // Fetch from Server
            try {
                const btn = document.querySelector('.btn-refresh');
                btn.innerText = "Loading...";
                
                const response = await fetch('/api/admin/all-registrations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 403) {
                    alert("Access Denied: You are not an admin.");
                    window.location.href = '/';
                    return;
                }

                if (!response.ok) throw new Error("Failed to fetch data");

                const data = await response.json();
                
                // Save to Cache
                localStorage.setItem('adminData', JSON.stringify(data));
                
                // Render
                renderTable(data);
                btn.innerText = "🔄 Refresh Data";

            } catch (err) {
                console.error(err);
                alert("Error loading data: " + err.message);
            }
        }

        // Run on Page Load
        window.onload = () => fetchData(); 
    </script>
    <script>
        // --- INACTIVITY AUTO-LOGOUT ---
        let idleTime = 0;
        const timeoutLimit = 10; // Set timeout limit in minutes

        // Increment the idle time counter every minute
        const idleInterval = setInterval(timerIncrement, 10000); // 1 minute = 60000 ms

        // Reset the timer whenever the user interacts with the page
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('keypress', resetTimer);
        document.addEventListener('click', resetTimer);
        document.addEventListener('scroll', resetTimer);

        function handleLogout(){
           /* window.location.href = "login.html"; */
            localStorage.removeItem('supabaseToken');
            //localStorage.removeItem('adminData'); // Clear admin cache too if it exists

            // 2. Replace the current history entry
            // This removes the current page from the "Back" stack
            window.location.replace('login.html');
        }

        function timerIncrement() {
            idleTime++;
            if (idleTime >= timeoutLimit) {
                // User has been idle for 15 minutes
                clearInterval(idleInterval);
                alert("Your session has expired due to inactivity. Please log in again.");
                handleLogout(); // Calls your existing logout function
            }
        }

        function resetTimer() {
            idleTime = 0; // Reset counter on any interaction
        }
    </script>
</body>
</html>
