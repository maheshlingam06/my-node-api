<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Reunion 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 20px; }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; }
        
        input[type="text"] {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 300px;
        }
        
        button {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-refresh { background-color: #2563eb; color: white; }
        .btn-refresh:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #cbd5e1; color: #334155; }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; font-weight: 600; color: #475569; position: sticky; top: 0; }
        tr:hover { background-color: #f8fafc; }

        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-green { background-color: #dcfce7; color: #166534; }
        .badge-blue { background-color: #dbeafe; color: #1e40af; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Registration Dashboard</h2>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search any field (Name, Email, City)...">
            <button class="btn-refresh" onclick="fetchData(true)">🔄 Refresh Data</button>
            <button class="btn-clear" onclick="window.location.href='/'">Back to Home</button>
        </div>
    </div>

    <div class="table-container">
        <table id="regTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Location</th>
                    <th>Adults</th>
                    <th>Kids</th>
                    <th>Fri Stay</th>
                    <th>Fri Event</th>
                    <th>Sat Event</th>
                    <th>Est. Cost</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        // 1. Calculate Cost Helper (Same logic as registration page)
        function calculateRowCost(row) {
            let total = 0;
            const adults = row.teens_adults || 0;
            const kids = row.kids || 0;
            
            // Logic: 1st Adult is Alumni
            const alumniCount = adults > 0 ? 1 : 0;
            const extraAdults = adults > 1 ? adults - 1 : 0;

            // Fri Stay
            if (row.fri_night === 'yes_family') total += (alumniCount * 5000) + (extraAdults * 5000) + (kids * 2500);
            // Fri Event
            if (row.fri_reunion === 'yes') total += (alumniCount * 7000) + (extraAdults * 3000) + (kids * 2000);
            // Sat Event
            if (row.sat_reunion === 'yes_family') total += (alumniCount * 1500) + (extraAdults * 1500) + (kids * 750);

            return total;
        }

        // 2. Render Function
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Clear current rows

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding: 20px;">No records found.</td></tr>';
                return;
            }

            data.forEach(row => {
                const cost = calculateRowCost(row);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:500">${row.participant_name || '-'}</td>
                    <td>${row.mobile || '-'}</td>
                    <td>${row.email || '-'}</td>
                    <td>${row.location || '-'}</td>
                    <td>${row.teens_adults}</td>
                    <td>${row.kids}</td>
                    <td>${row.fri_night === 'yes_family' ? '<span class="badge badge-green">Yes</span>' : '-'}</td>
                    <td>${row.fri_reunion === 'yes' ? '<span class="badge badge-blue">Yes</span>' : '-'}</td>
                    <td>${row.sat_reunion === 'yes_family' ? '<span class="badge badge-blue">Yes</span>' : '-'}</td>
                    <td style="font-weight:bold">₹${cost.toLocaleString('en-IN')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Search Logic
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const storedData = localStorage.getItem('adminData');
            
            if (storedData) {
                const allData = JSON.parse(storedData);
                const filtered = allData.filter(row => {
                    // Combine all searchable fields into one string for easy checking
                    const searchableStr = `
                        ${row.participant_name} 
                        ${row.email} 
                        ${row.mobile} 
                        ${row.location}
                    `.toLowerCase();
                    return searchableStr.includes(term);
                });
                renderTable(filtered);
            }
        });

        // 4. Fetch Logic (Cache First Strategy)
        async function fetchData(forceRefresh = false) {
            const token = localStorage.getItem('supabaseToken');
            if (!token) {
                alert("You must be logged in to view this page.");
                window.location.href = '/login.html';
                return;
            }

            // Check Cache first
            const cached = localStorage.getItem('adminData');
            if (cached && !forceRefresh) {
                console.log("Loading from LocalStorage...");
                renderTable(JSON.parse(cached));
                return;
            }

            // Fetch from Server
            try {
                const btn = document.querySelector('.btn-refresh');
                btn.innerText = "Loading...";
                
                const response = await fetch('/api/admin/all-registrations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 403) {
                    alert("Access Denied: You are not an admin.");
                    window.location.href = '/';
                    return;
                }

                if (!response.ok) throw new Error("Failed to fetch data");

                const data = await response.json();
                
                // Save to Cache
                localStorage.setItem('adminData', JSON.stringify(data));
                
                // Render
                renderTable(data);
                btn.innerText = "🔄 Refresh Data";

            } catch (err) {
                console.error(err);
                alert("Error loading data: " + err.message);
            }
        }

        // Run on Page Load
        window.onload = () => fetchData(); 
    </script>

</body>
</html>
