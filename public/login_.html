<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCE 2026 Reunion - Login</title><style>:root{--primary:#2563eb;--bg:#f8fafc;--text:#1e293b;--border:#e2e8f0;--white:#ffffff}body{font-family:Inter,sans-serif;background-color:var(--bg);display:flex;justify-content:center;align-items:center;height:100vh;margin:0;flex:1}.card{background:var(--white);padding:30px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid var(--border);width:100%;max-width:400px}h2{color:var(--primary);margin-bottom:20px;font-size:1.5rem;text-align:center}.input-group{margin-bottom:15px}label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box}.btn-submit{width:100%;background:var(--primary);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}.btn-submit:hover{background:#1d4ed8}.footer-links{text-align:center;margin-top:20px;font-size:14px}.footer-links a{color:var(--primary);text-decoration:none;font-weight:600}.loader{display:none;text-align:center;margin-top:10px;font-size:14px;color:var(--primary)}.copyright-panel{text-align:center;padding:20px;font-size:12px;color:rgba(0,0,0,.6);margin-top:auto;position:fixed;bottom:10px}.modal{display:none;position:fixed;z-index:1001;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,.4)}.modal-content{background-color:#fefefe;margin:15% auto;padding:25px;border:1px solid #888;width:90%;max-width:400px;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}.close-modal{color:#aaa;float:right;font-size:28px;font-weight:700;cursor:pointer;line-height:1}.close-modal:focus,.close-modal:hover{color:#333;text-decoration:none}.forgot-link{text-align:right;margin-top:-8px;margin-bottom:15px}.forgot-link a{font-size:12px;color:var(--primary);text-decoration:none;font-weight:600}.forgot-link a:hover{text-decoration:underline}</style><script src="https://www.google.com/recaptcha/api.js?render=__SITE_KEY__"></script></head><body><div class="card"><h2>Welcome Back</h2><p style="text-align:center;font-size:14px;color:#64748b;margin-bottom:20px">Log in to manage your registration</p><div class="input-group"><label>Email Address</label> <input type="email" id="email" placeholder="family@example.com" required></div><div class="input-group" style="margin-bottom:5px"><label>Password</label> <input type="password" id="password" placeholder="••••••••" required></div><div class="forgot-link"><a href="#" id="openForgotModal">Forgot Password?</a></div><button id="submitBtn" onclick="handleLogin()" class="btn-submit">Login</button><div id="loader" class="loader">Authenticating...</div><div class="footer-links">Don't have an account? <a href="signup">Sign Up</a></div></div><div id="forgotPwdModal" class="modal"><div class="modal-content"><span class="close-modal">&times;</span><h3 style="color:var(--primary);margin-top:0;margin-bottom:10px">Reset Password</h3><p style="font-size:13px;color:#64748b;margin-top:0;margin-bottom:20px">Enter your email address and we will send you a link to reset your password.</p><div class="input-group"><input type="email" id="resetEmail" placeholder="Enter your email" required></div><button id="resetBtn" onclick="handleResetPassword()" class="btn-submit">Send Reset Link</button><div id="resetLoader" class="loader">Sending...</div></div></div><footer class="copyright-panel">&copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.</footer><script>async function handleLogin(){const e=document.getElementById("email").value,t=document.getElementById("password").value,n=document.getElementById("submitBtn"),o=document.getElementById("loader");if(!e||!t)return alert("Please enter both email and password.");n.style.display="none",o.style.display="block",grecaptcha.ready(function(){grecaptcha.execute("__SITE_KEY__",{action:"signup"}).then(async a=>{try{const a=await fetch("../login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:t})}),l=await a.json();a.ok?(localStorage.setItem("supabaseToken",l.session.access_token),localStorage.setItem("userType",l.userType),window.location.href=`registration.html?email=${encodeURIComponent(e)}`):(l.error&&l.error.includes("Email not confirmed")?alert("Please check your email and click the verification link before logging in!"):alert("Login failed: "+(l.error||"Invalid credentials")),n.style.display="block",o.style.display="none")}catch(e){alert("Server error. Please try again."),n.style.display="block",o.style.display="none"}})})}const modal=document.getElementById("forgotPwdModal"),openModalLink=document.getElementById("openForgotModal"),closeModalSpan=document.getElementsByClassName("close-modal")[0];async function handleResetPassword(){const e=document.getElementById("resetEmail").value,t=document.getElementById("resetBtn"),n=document.getElementById("resetLoader");if(!e)return alert("Please enter your email address.");t.style.display="none",n.style.display="block";try{const t=await fetch("../forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e})}),n=await t.json();t.ok?(alert("Success! If an account exists, a reset link has been sent to your email."),modal.style.display="none"):alert("Error: "+(n.error||"Failed to process request."))}catch(e){alert("Server error. Please try again later.")}finally{t.style.display="block",n.style.display="none"}}openModalLink.onclick=function(e){e.preventDefault(),modal.style.display="block",document.getElementById("resetEmail").value=document.getElementById("email").value},closeModalSpan.onclick=function(){modal.style.display="none"},window.onclick=function(e){e.target==modal&&(modal.style.display="none")}</script></body></html>
