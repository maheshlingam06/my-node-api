<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCE 2026 Reunion - Login</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex:1}
        .card { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); width: 100%; max-width: 400px; }
        h2 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        .footer-links { text-align: center; margin-top: 20px; font-size: 14px; }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .loader { display: none; text-align: center; margin-top: 10px; font-size: 14px; color: var(--primary); }
        .copyright-panel { text-align: center; padding: 20px; font-size: 12px; color: rgba(0,0,0,0.6); margin-top: auto; position: fixed; bottom: 10px;}


    </style>
    <script src="https://www.google.com/recaptcha/api.js?render=__SITE_KEY__"></script>
</head>
<body>

<div class="card">
    <h2>Welcome Back</h2>
    <p style="text-align: center; font-size: 14px; color: #64748b; margin-bottom: 20px;">Log in to manage your registration</p>
    
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="family@example.com" required>
    </div>
    
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <button id="submitBtn" onclick="handleLogin()" class="btn-submit">Login</button>
    <div id="loader" class="loader">Authenticating...</div>

    <div class="footer-links">
        Don't have an account? <a href="signup">Sign Up</a>
    </div>
</div>
<footer class="copyright-panel">
    &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
</footer>

<script>
async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');

    if(!email || !password) return alert("Please enter both email and password.");

    btn.style.display = 'none';
    loader.style.display = 'block';

    grecaptcha.ready(function() {
        grecaptcha.execute('__SITE_KEY__', {action: 'signup'}).then(async (token) => {
            try {
                const response = await fetch('../login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Store the token so the user stays logged in
                    localStorage.setItem('supabaseToken', result.session.access_token);
                    localStorage.setItem('userType', result.userType);
                    
                    // Redirect to the registration form (Step 2)
                    window.location.href = `registration.html?email=${encodeURIComponent(email)}`;
                } else {
                    // Check specifically for the unverified email error
                    if (result.error && result.error.includes("Email not confirmed")) {
                        alert("Please check your email and click the verification link before logging in!");
                    } else {
                        alert("Login failed: " + (result.error || "Invalid credentials"));
                    }
                    btn.style.display = 'block';
                    loader.style.display = 'none';
                }
            } catch (err) {
                alert("Server error. Please try again.");
                btn.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    });
}
</script>

</body>
</html>
