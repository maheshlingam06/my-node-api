<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Metrics - Reunion 2026</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);:root{--primary:#2563eb;--white:#ffffff;--overlay:rgba(0, 0, 0, 0.75);--color-text-main:#000000;--color-action-warm:#d9430f;--color-trust-blue:#0b5fb5;--bg-page:#f8fafc;--white:#ffffff;--border:#cbd5e1;--text-muted:#475569}body,html{margin:0;padding:0;min-height:100%;font-family:Inter,sans-serif}.bg-image{background-image:url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/JGems-TCE-Black.jpeg');min-height:100vh;background-position:center;background-attachment:fixed;background-size:cover;background-repeat:no-repeat;background-size:contain;position:relative;background-color:#0f172a}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background-color:var(--overlay);overflow-y:auto;display:flex;flex-direction:column}.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;z-index:10}.logo{color:var(--white);font-size:24px;font-weight:700;text-decoration:none}.nav-links{display:flex;gap:30px;align-items:center}.nav-links a{color:var(--white);text-decoration:none;font-size:15px;font-weight:500;opacity:.9;transition:all .2s}.nav-links a:hover{opacity:1;color:#bfdbfe}.page-container{flex-grow:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px;width:100%;box-sizing:border-box}.page-header{text-align:center;color:#fff;margin-bottom:50px}.page-header h1{font-size:3rem;margin:0 0 10px 0;font-weight:800;letter-spacing:-1px}.page-header p{font-size:1.1rem;color:#cbd5e1;margin:0}.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;width:100%;max-width:1200px}.summary-cards{display:flex;gap:20px;margin-bottom:50px}.summary-card{background:var(--white);padding:20px;border-radius:8px;border:1px solid var(--border);flex:1;box-shadow:0 4px 6px -1px rgba(0,0,0,.05);width:210px;min-width:fit-content}.summary-title{font-size:.9rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;margin-bottom:8px}.summary-value{font-size:2rem;font-weight:800;color:var(--color-trust-blue)}.summary-value.total{color:var(--color-action-warm)}.gauge-card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:25px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}.dept-title{color:#e2e8f0;font-size:1.1rem;font-weight:700;margin-bottom:15px;text-align:center}.chart-container{position:relative;height:150px;width:100%;display:flex;justify-content:center}.gauge-text-center{position:absolute;bottom:10px;text-align:center;display:flex;flex-direction:column;align-items:center}.gauge-ratio{font-size:24px;font-weight:800;color:#fff;line-height:1}.gauge-sub{font-size:12px;color:#94a3b8;font-weight:500;margin-top:4px}.loading{text-align:center;color:#cbd5e1;padding:40px;font-size:1.1rem}@media (max-width:900px){.summary-cards{flex-direction:column;gap:15px}.navbar{flex-direction:column;padding:20px 10px;gap:15px}}</style></head><body><div class="bg-image"><div class="overlay"><nav class="navbar"><a href="/" class="logo">TCE Reunion 2026</a><div class="nav-links"><a href="login_.html">Sign-in</a> <a href="schedule.html">Program</a> <a href="attendees.html" style="color:#bfdbfe">Who's Coming</a> <a href="blog.html">Blog</a></div></nav><div class="page-container"><div class="page-header"><h1>Donors by Department</h1><p># of donors vs total strength</p></div><div id="loading" class="loading">Fetching live metrics...</div><div class="summary-cards"><div class="summary-card"><div class="summary-title">Total Pledged (All Funds)</div><div class="summary-value total" id="stat-total-pledged">₹0</div></div><div class="summary-card"><div class="summary-title">Total Donors</div><div class="summary-value" id="stat-donors">0</div></div><div class="summary-card"><div class="summary-title">Avg. Pledge / Donor</div><div class="summary-value" id="stat-avg" style="color:#0f172a">₹0</div></div></div><div id="metrics-grid" class="metrics-grid"></div></div><footer style="text-align:center;padding:20px;font-size:12px;color:rgba(255,255,255,.4);margin-top:auto">&copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.</footer></div></div><script>async function fetchDonations(){try{const t=await fetch("/api/admin/all-donations-guest",{headers:{Authorization:"Bearer "}}),e=await t.json();if(0===e.length)return;renderTableRows(e)}catch(t){console.error("Error:",t)}}function renderTableRows(t){let e=0;0!==t.length&&(t.forEach(t=>{new Date(t.created_at).toLocaleDateString("en-IN",{month:"short",day:"numeric",year:"numeric"});e+=Number(t.total_amount)}),document.getElementById("stat-total-pledged").innerText=formatCurrency(e),document.getElementById("stat-donors").innerText=t.length,document.getElementById("stat-avg").innerText=formatCurrency(t.length?Math.round(e/t.length):0))}function formatCurrency(t){return t?"₹"+t.toLocaleString("en-IN"):"-"}document.addEventListener("DOMContentLoaded",async()=>{const t=document.getElementById("loading"),e=document.getElementById("metrics-grid");fetchDonations();try{const n=await fetch("/api/donations/department-metrics");if(!n.ok)throw new Error("Failed to fetch metrics");const a=await n.json();if(t.style.display="none",!a||0===a.length)return void(e.innerHTML='<div style="color:white; text-align:center; width: 100%;">No data available.</div>');a.forEach((t,n)=>{const a=`gauge-${n}`,o=Math.max(t.total_strength-t.donors,0),r=Math.round(t.donors/t.total_strength*100)||0,d=`\n                        <div class="gauge-card">\n                            <div class="dept-title">${t.department}</div>\n                            <div class="chart-container">\n                                <canvas id="${a}"></canvas>\n                                <div class="gauge-text-center">\n                                    <span class="gauge-ratio">${t.donors} / ${t.total_strength}</span>\n                                    <span class="gauge-sub">${r}% Participated</span>\n                                </div>\n                            </div>\n                        </div>\n                    `;e.insertAdjacentHTML("beforeend",d);const i=document.getElementById(a).getContext("2d");new Chart(i,{type:"doughnut",data:{datasets:[{data:[t.donors,o],backgroundColor:["#3b82f6","rgba(255, 255, 255, 0.1)"],borderWidth:0,borderRadius:5}]},options:{rotation:270,circumference:180,cutout:"75%",responsive:!0,maintainAspectRatio:!1,plugins:{tooltip:{enabled:!1},legend:{display:!1}}}})})}catch(e){console.error("Error loading metrics:",e),t.innerHTML="Sorry, we couldn't load the metrics right now."}})</script></body></html>
