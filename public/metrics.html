<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Metrics - Reunion 2026</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);:root{--primary:#2563eb;--white:#ffffff;--overlay:rgba(0, 0, 0, 0.75)}body,html{margin:0;padding:0;min-height:100%;font-family:Inter,sans-serif}.bg-image{background-image:url('https://pqpdxdwrgwcxvjsgdoiy.supabase.co/storage/v1/object/public/assets/JGems-TCE-Black.jpeg');min-height:100vh;background-position:center;background-attachment:fixed;background-size:cover;background-color:#0f172a}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background-color:var(--overlay);overflow-y:auto;display:flex;flex-direction:column}.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;z-index:10}.logo{color:var(--white);font-size:24px;font-weight:700;text-decoration:none}.page-container{flex-grow:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px;width:100%;box-sizing:border-box}.page-header{text-align:center;color:#fff;margin-bottom:50px}.page-header h1{font-size:3rem;margin:0 0 10px 0;font-weight:800;letter-spacing:-1px}.page-header p{font-size:1.1rem;color:#cbd5e1;margin:0}.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;width:100%;max-width:1200px}.gauge-card{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:25px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}.dept-title{color:#e2e8f0;font-size:1.1rem;font-weight:700;margin-bottom:15px;text-align:center}.chart-container{position:relative;height:150px;width:100%;display:flex;justify-content:center}.gauge-text-center{position:absolute;bottom:10px;text-align:center;display:flex;flex-direction:column;align-items:center}.gauge-ratio{font-size:24px;font-weight:800;color:#fff;line-height:1}.gauge-sub{font-size:12px;color:#94a3b8;font-weight:500;margin-top:4px}.loading{text-align:center;color:#cbd5e1;padding:40px;font-size:1.1rem}</style></head><body><div class="bg-image"><div class="overlay"><nav class="navbar"><a href="/" class="logo">TCE Reunion 2026</a></nav><div class="page-container"><div class="page-header"><h1>Donors by Department</h1><p># of donors against total alumni strength</p></div><div id="loading" class="loading">Fetching live metrics...</div><div id="metrics-grid" class="metrics-grid"></div></div></div></div><script>document.addEventListener("DOMContentLoaded",async()=>{const t=document.getElementById("loading"),e=document.getElementById("metrics-grid");try{const n=await fetch("/api/donations/department-metrics");if(!n.ok)throw new Error("Failed to fetch metrics");const a=await n.json();if(t.style.display="none",!a||0===a.length)return void(e.innerHTML='<div style="color:white; text-align:center; width: 100%;">No data available.</div>');a.forEach((t,n)=>{const a=`gauge-${n}`,o=Math.max(t.total_strength-t.donors,0),d=Math.round(t.donors/t.total_strength*100)||0,r=`\n                        <div class="gauge-card">\n                            <div class="dept-title">${t.department}</div>\n                            <div class="chart-container">\n                                <canvas id="${a}"></canvas>\n                                <div class="gauge-text-center">\n                                    <span class="gauge-ratio">${t.donors} / ${t.total_strength}</span>\n                                    <span class="gauge-sub">${d}% Participated</span>\n                                </div>\n                            </div>\n                        </div>\n                    `;e.insertAdjacentHTML("beforeend",r);const i=document.getElementById(a).getContext("2d");new Chart(i,{type:"doughnut",data:{datasets:[{data:[t.donors,o],backgroundColor:["#3b82f6","rgba(255, 255, 255, 0.1)"],borderWidth:0,borderRadius:5}]},options:{rotation:270,circumference:180,cutout:"75%",responsive:!0,maintainAspectRatio:!1,plugins:{tooltip:{enabled:!1},legend:{display:!1}}}})})}catch(e){console.error("Error loading metrics:",e),t.innerHTML="Sorry, we couldn't load the metrics right now."}})</script></body></html>
