<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Reunion 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; padding: 20px; }
        
        /* Header & Controls */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; }
        
        input[type="text"] {
            padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 300px;
        }

        .copyright-panel { text-align: center; padding: 20px; font-size: 12px; color: rgba(0,0,0,0.6); margin-top: 40px;}
        
        button {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-refresh { background-color: #2563eb; color: white; }
        .btn-refresh:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #cbd5e1; color: #334155; }

        /* Table Styling */
        .table-container { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow-x: auto; }
        /* Increased min-width to accommodate new columns */
        table { width: 100%; border-collapse: collapse; min-width: 1800px; }
        
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        th { background-color: #f8fafc; font-weight: 600; color: #475569; position: sticky; top: 0; }
        tr:hover { background-color: #f8fafc; }

        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block;}
        .badge-green { background-color: #dcfce7; color: #166534; }
        .badge-blue { background-color: #dbeafe; color: #1e40af; }
        .badge-purple { background-color: #f3e8ff; color: #6b21a8; }
        .badge-orange { background-color: #ffedd5; color: #c2410c; }

        .btn-logout {
            background-color: var(--white);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--danger);
            color: var(--white);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Registration Dashboard</h2>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search Name, Email, Dept, Reg No...">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                <button onclick="exportTableToCSV('Reunion_Registrations_2026.csv')" style="background-color: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; transition: all 0.2s;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export to Excel
                </button>
            </div>
            <button class="btn-refresh" onclick="fetchData(true)">🔄 Refresh Data</button>
            <button class="btn-clear" onclick="window.location.href='/'">Back to Home</button>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="table-container">
        <table id="regTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Reg No</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Dept</th>
                    <th>Spouse</th>
                    <th>Kids(&gt;10y)</th>
                    <th>Kids(6-10y)</th>
                    <th>Kids(&lt;6y)</th>
                    <th>Thu Stay</th>
                    <th>Fri Event</th>
                    <th>Fri Stay</th>
                    <th>Sat Event</th>
                    <th>Sat Stay</th>
                    <th>Culturals</th>
                    <th>Volunteer</th>
                    <th>T-Shirt</th>
                    <th>Donation</th>
                    <th>Total Cost</th>
                    <th>Payment Status</th>
                    <th>Amount Rcvd</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
    
    <footer class="copyright-panel">
        &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
    </footer>

    <script>
        window.addEventListener('pageshow', (event) => {
            const token = localStorage.getItem('supabaseToken');
            if (!token) {
                window.location.replace('/login'); 
            }
        });

        // 1. UPDATED COST CALCULATION (Matches the new Frontend Spouse logic)
        function calculateRowCost(row) {
            const spouseAttending = row.spouse_attending === 'Yes';
            const familyAdults = parseInt(row.adults_and_above_10) || parseInt(row.teens_adults) || 0;
            const kids6to10 = parseInt(row.kids_6_10) || parseInt(row.kids) || 0;
            const donation = parseInt(row.donation_amount) || 0;

            let total = 0;

            // Friday Event
            total += 7000; 
            if (row.fri_family_join === 'family' || row.fri_reunion === 'yes') {
                if (spouseAttending) total += 2000;
                total += (familyAdults * 1500);
                total += (kids6to10 * 1000);
            }

            // Saturday Event
            if (row.sat_attend_type && row.sat_attend_type !== 'no') {
                total += 1500;
                if (row.sat_attend_type === 'family') {
                    if (spouseAttending) total += 1000;
                    total += (familyAdults * 1000);
                    total += (kids6to10 * 500);
                }
            }

            // Stay Helper
            function getStayCost(type) {
                if (!type || type === 'no') return 0;
                let cost = 5500;
                if (type === 'family' || type === 'yes_family') {
                    if (spouseAttending) cost += 5500;
                    cost += (familyAdults * 2500);
                    cost += (kids6to10 * 2000);
                }
                return cost;
            }

            total += getStayCost(row.thu_stay_type || row.thu_night);
            total += getStayCost(row.fri_stay_type || row.fri_night);
            total += getStayCost(row.sat_stay_type || row.sat_night);
            
            total += donation;

            return total;
        }

        const formatSel = (v) => {
            if(v === 'family' || v === 'yes_family') return '<span class="badge badge-green">Family</span>';
            if(v === 'self' || v === 'yes_single' || v === 'yes') return '<span class="badge badge-blue">Self/Yes</span>';
            return '-';
        };

        // 2. RENDER FUNCTION
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="22" style="text-align:center; padding: 20px;">No records found.</td></tr>';
                return;
            }

            data.forEach(row => {
                const cost = calculateRowCost(row);
                const tr = document.createElement('tr');
                
                const displayAdults = row.adults_and_above_10 !== undefined ? row.adults_and_above_10 : (row.teens_adults || 0);
                const displayKids = row.kids_6_10 !== undefined ? row.kids_6_10 : (row.kids || 0);
                const displayBabies = row.kids_under_6 !== undefined ? row.kids_under_6 : 0;
                const displayDept = row.department || row.location || '-';

                // Format the Yes/No tags for the new fields
                const spouseBadge = row.spouse_attending === 'Yes' ? '<span class="badge badge-green">Yes</span>' : 'No';
                const culturalBadge = row.performing_culturals === 'Yes' ? '<span class="badge badge-purple">Yes</span>' : 'No';
                const volunteerBadge = row.volunteering === 'Yes' ? '<span class="badge badge-orange">Yes</span>' : 'No';

                tr.innerHTML = `
                    <td style="font-weight:500">${row.participant_name || '-'}</td>
                    <td>${row.class_reg_no || '-'}</td>
                    <td>${row.mobile || '-'}</td>
                    <td>${row.email || '-'}</td>
                    <td>${displayDept}</td>
                    
                    <td>${spouseBadge}</td>
                    <td>${displayAdults}</td>
                    <td>${displayKids}</td>
                    <td>${displayBabies}</td>
                    
                    <td>${formatSel(row.thu_stay_type || row.thu_night)}</td>
                    <td>${formatSel(row.fri_family_join || row.fri_reunion)}</td>
                    <td>${formatSel(row.fri_stay_type || row.fri_night)}</td>
                    <td>${formatSel(row.sat_attend_type || row.sat_reunion)}</td>
                    <td>${formatSel(row.sat_stay_type || row.sat_night)}</td>
                    
                    <td>${culturalBadge}</td>
                    <td>${volunteerBadge}</td>
                    <td style="font-weight:600">${row.t_shirt_size || '-'}</td>

                    <td>₹${(row.donation_amount || 0).toLocaleString('en-IN')}</td>
                    <td style="font-weight:bold; color: #1e3a8a;">₹${cost.toLocaleString('en-IN')}</td>
                    
                    <td>
                        <select id="status-${row.user_id}" style="padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 12px;">
                            <option value="Pending" ${!row.payment_status || row.payment_status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Partial" ${row.payment_status === 'Partial' ? 'selected' : ''}>Partial</option>
                            <option value="Full" ${row.payment_status === 'Full' ? 'selected' : ''}>Full</option>
                        </select>
                    </td>
                    <td>
                        <input type="number" id="amount-${row.user_id}" value="${row.amount_received || 0}" style="width: 70px; padding: 4px; border-radius: 4px; border: 1px solid #cbd5e1; font-size: 12px;">
                    </td>
                    <td>
                        <button onclick="savePayment('${row.user_id}')" style="background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px;">Save</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // SAVE PAYMENT ACTION
        async function savePayment(userId) {
            const status = document.getElementById(`status-${userId}`).value;
            const amount = document.getElementById(`amount-${userId}`).value;
            const token = localStorage.getItem('supabaseToken');

            try {
                const response = await fetch('/admin/update-payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        payment_status: status,
                        amount_received: amount
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Payment updated successfully!");
                    localStorage.removeItem('adminData'); 
                } else {
                    alert("Error: " + (result.error || "Failed to save"));
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Server error. Please try again.");
            }
        }

        // 3. Search Logic
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const storedData = localStorage.getItem('adminData');
            
            if (storedData) {
                const allData = JSON.parse(storedData);
                const filtered = allData.filter(row => {
                    const searchableStr = `
                        ${row.participant_name} 
                        ${row.email} 
                        ${row.mobile} 
                        ${row.department} 
                        ${row.class_reg_no}
                        ${row.payment_status}
                    `.toLowerCase();
                    return searchableStr.includes(term);
                });
                renderTable(filtered);
            }
        });

        // EXPORT TO EXCEL LOGIC
        function exportTableToCSV(filename) {
            const table = document.getElementById("regTable"); 
            let csv = [];
            
            for (let i = 0; i < table.rows.length; i++) {
                let row = [];
                let cols = table.rows[i].querySelectorAll("td, th");
                
                // Skip the last 'Actions' column
                for (let j = 0; j < cols.length - 1; j++) {
                    let data = "";
                    const inputElement = cols[j].querySelector('input, select');
                    if (inputElement) {
                        data = inputElement.value;
                    } else {
                        data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").trim();
                    }
                    
                    data = data.replace(/"/g, '""');
                    row.push('"' + data + '"');
                }
                csv.push(row.join(","));
            }
            downloadCSV(csv.join("\n"), filename);
        }

        function downloadCSV(csv, filename) {
            let csvFile = new Blob([csv], {type: "text/csv;charset=utf-8;"});
            let downloadLink = document.createElement("a");
            downloadLink.download = filename;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // 4. Fetch Logic
        async function fetchData(forceRefresh = false) {
            const token = localStorage.getItem('supabaseToken');
            if (!token) {
                alert("You must be logged in to view this page.");
                window.location.href = '/login';
                return;
            }

            const userType = localStorage.getItem('userType');
            if (userType != 'x'){
                localStorage.removeItem('adminData');
                alert("Access Denied: You are not an admin.");
                return;
            }

            if (!forceRefresh && userType == 'x') {
                const cached = localStorage.getItem('adminData');
                if (cached) {
                    renderTable(JSON.parse(cached));
                    return;
                }
            }

            try {
                const btn = document.querySelector('.btn-refresh');
                btn.innerText = "Loading...";
                
                const response = await fetch('/api/admin/all-registrations', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 403) {
                    alert("Access Denied: You are not an admin.");
                    window.location.href = '/';
                    return;
                }

                if (!response.ok) throw new Error("Failed to fetch data");

                const data = await response.json();
                
                localStorage.setItem('adminData', JSON.stringify(data));
                renderTable(data);
                btn.innerText = "🔄 Refresh Data";

            } catch (err) {
                console.error(err);
                alert("Error loading data: " + err.message);
            }
        }

        window.onload = () => {
            fetchData();
        }

        // INACTIVITY AUTO-LOGOUT
        let idleTime = 0;
        const timeoutLimit = 10; 
        const idleInterval = setInterval(timerIncrement, 60000); 

        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('keypress', resetTimer);
        document.addEventListener('click', resetTimer);
        document.addEventListener('scroll', resetTimer);

        function handleLogout(){
            localStorage.removeItem('supabaseToken');
            window.location.replace('login');
        }

        function timerIncrement() {
            idleTime++;
            if (idleTime >= timeoutLimit) {
                clearInterval(idleInterval);
                alert("Your session has expired due to inactivity. Please log in again.");
                handleLogout(); 
            }
        }

        function resetTimer() { idleTime = 0; }
    </script>
</body>
</html>
