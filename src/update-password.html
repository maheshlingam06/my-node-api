<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCE 2026 Reunion - Update Password</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --border: #e2e8f0; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex:1}
        .card { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border); width: 100%; max-width: 400px; }
        h2 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        .loader { display: none; text-align: center; margin-top: 10px; font-size: 14px; color: var(--primary); }
        .copyright-panel { text-align: center; padding: 20px; font-size: 12px; color: rgba(0,0,0,0.6); margin-top: auto; position: fixed; bottom: 10px;}
        .error-message { color: #ef4444; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Create New Password</h2>
    <p style="text-align: center; font-size: 14px; color: #64748b; margin-bottom: 20px;">Please enter your new password below.</p>
    
    <div class="input-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required>
    </div>
    
    <div class="input-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
    </div>

    <button id="submitBtn" onclick="handleUpdatePassword()" class="btn-submit">Save New Password</button>
    <div id="loader" class="loader">Updating...</div>
    <div id="errorMsg" class="error-message"></div>
</div>

<footer class="copyright-panel">
    &copy; 2026 LEGENDS IT Consulting & Services. All rights reserved.
</footer>

<script>
    // 1. Extract the secure token Supabase hid in the URL hash when redirecting the user
    let accessToken = null;
    
    window.onload = function() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        accessToken = params.get('access_token');
        const type = params.get('type');

        if (!accessToken || type !== 'recovery') {
            document.getElementById('errorMsg').innerText = "Invalid or expired recovery link. Please request a new one.";
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').style.opacity = '0.5';
        }
    };

    // 2. Send the new password and the token to your Node server
    async function handleUpdatePassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        if (!newPassword || !confirmPassword) {
            errorMsg.innerText = "Please fill out both fields.";
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMsg.innerText = "Passwords do not match.";
            errorMsg.style.display = 'block';
            return;
        }

        if (newPassword.length < 6) {
            errorMsg.innerText = "Password must be at least 6 characters.";
            errorMsg.style.display = 'block';
            return;
        }

        btn.style.display = 'none';
        loader.style.display = 'block';

        try {
            const response = await fetch('../update-password', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}` // Pass the token securely
                },
                body: JSON.stringify({ password: newPassword })
            });

            const result = await response.json();

            if (response.ok) {
                alert("Success! Your password has been updated. Please log in.");
                window.location.href = "login"; // Send them back to the login page
            } else {
                errorMsg.innerText = result.error || "Failed to update password.";
                errorMsg.style.display = 'block';
                btn.style.display = 'block';
                loader.style.display = 'none';
            }
        } catch (err) {
            errorMsg.innerText = "Server error. Please try again later.";
            errorMsg.style.display = 'block';
            btn.style.display = 'block';
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
